openapi: 3.0.3
info:
  title: ONE Comunicacao API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API e banco operacionais
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
      responses:
        "200":
          description: Access token emitido e refresh cookie definido
  /auth/refresh:
    post:
      summary: Rotaciona refresh token e emite novo access token
      responses:
        "200":
          description: Sessao renovada
  /auth/logout:
    post:
      summary: Revoga refresh token atual
      responses:
        "204":
          description: Logout realizado
  /dashboard:
    get:
      summary: Dashboard conforme perfil
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados do dashboard
  /clients:
    get:
      summary: Lista clientes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de clientes
    post:
      summary: Cria cliente
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Cliente criado
  /contacts:
    get:
      summary: Lista leads
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de leads
    post:
      summary: Cria lead
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Lead criado
  /charges:
    get:
      summary: Lista cobrancas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de cobrancas
    post:
      summary: Cria cobranca
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Cobranca criada
  /charges/{id}/payment-data:
    get:
      summary: Retorna dados sensiveis de pagamento sob autorizacao
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dados de pagamento autorizados
        "404":
          description: Cobranca nao encontrada
  /calendar-events:
    get:
      summary: Lista eventos do calendario conforme escopo do usuario
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de eventos
    post:
      summary: Cria evento interno ou vinculado a cliente
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Evento criado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
