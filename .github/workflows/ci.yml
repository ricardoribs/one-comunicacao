name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Lint backend
        run: npm run lint --prefix backend
      - name: Dependency audit
        run: npm run audit:deps --prefix backend
      - name: Validate frontend scripts
        run: npm run check:frontend
      - name: Build Docker image
        run: docker build -t one-comunicacao:ci .

  integration:
    name: Integration and smoke
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: one_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d one_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/one_ci
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 15m
      APP_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: test-key
      EMAIL_FROM: no-reply@example.test
      UPLOAD_PROVIDER: cloudinary
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      PAYMENT_PROVIDER: manual
      ALLOW_ADMIN_BOOTSTRAP: "true"
      BOOTSTRAP_ADMIN_NAME: CI Admin
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: StrongPassword!123456
      SMOKE_BASE_URL: http://127.0.0.1:3000
      SMOKE_EMAIL: ci-admin@example.test
      SMOKE_PASSWORD: StrongPassword!123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Apply migrations
        run: npm run db:migrate --prefix backend
      - name: Run backend tests
        run: npm test --prefix backend
      - name: Bootstrap first admin
        run: npm run bootstrap:admin --prefix backend
      - name: Verify row level security
        run: npm run verify:rls --prefix backend
      - name: Start API
        run: |
          npm run start --prefix backend > backend.log 2>&1 &
          echo $! > backend.pid
      - name: Wait for readiness check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat backend.log
          exit 1
      - name: Smoke test
        run: npm run smoke --prefix backend
      - name: Stop API
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
          if [ -f backend.log ]; then
            cat backend.log
          fi
