name: CI

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint backend
        run: npm run lint
      - name: Dependency audit
        run: npm run audit:deps
      - name: Audit tenant guard
        run: npm run audit:tenant
      - name: Validate frontend scripts
        run: npm run check:frontend
      - name: Prepare production contract env
        shell: bash
        run: |
          write_env() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
          }

          repeat_env() {
            local value
            value="$(printf "%${2}s" "" | tr " " "$3")"
            write_env "$1" "$value"
          }

          write_env NODE_ENV production
          write_env TRUST_PROXY 1
          write_env APP_BASE_URL https://app.example.test
          write_env CORS_ORIGINS https://app.example.test
          write_env DATABASE_URL postgresql://postgres:postgres@example.com:5432/postgres
          write_env DATABASE_SSL_REQUIRED true
          write_env DATABASE_SSL_CA_PEM ci-ca-placeholder
          write_env VERIFY_DATABASE_URL postgresql://postgres:postgres@example.com:5432/postgres
          repeat_env JWT_SECRET 64 j
          write_env JWT_EXPIRES_IN 15m
          write_env BCRYPT_ROUNDS 12
          repeat_env MFA_ENCRYPTION_KEY 32 m
          repeat_env FINANCIAL_ENCRYPTION_KEY 32 f
          write_env UPLOAD_PROVIDER cloudinary
          write_env UPLOAD_REQUIRE_MALWARE_SCAN false
          write_env MALWARE_SCAN_PROVIDER none
          write_env CLOUDINARY_CLOUD_NAME test-cloud
          write_env CLOUDINARY_API_KEY test-key
          write_env CLOUDINARY_API_SECRET test-secret
          write_env CLOUDINARY_REQUIRE_PRIVATE_UPLOAD true
          write_env EMAIL_PROVIDER resend
          write_env RESEND_API_KEY test-key
          write_env EMAIL_FROM no-reply@example.test
          write_env SENTRY_REQUIRED true
          write_env SENTRY_DSN https://example@sentry.invalid/1
          write_env SENTRY_ENVIRONMENT production
          write_env SENTRY_TRACES_SAMPLE_RATE 0.1
          write_env SMOKE_EMAIL ci-admin@example.test
          write_env SMOKE_PASSWORD StrongPassword!123456
      - name: Validate production env contract
        run: npm run validate:env -- --target=production --require-smoke --require-rls

  integration:
    name: Integration and smoke
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: one_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d one_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/one_ci
      VERIFY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/one_ci
      JWT_EXPIRES_IN: 15m
      BCRYPT_ROUNDS: "12"
      APP_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      EMAIL_PROVIDER: resend
      EMAIL_FROM: no-reply@example.test
      UPLOAD_PROVIDER: cloudinary
      UPLOAD_REQUIRE_MALWARE_SCAN: "false"
      MALWARE_SCAN_PROVIDER: none
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_REQUIRE_PRIVATE_UPLOAD: "true"
      PAYMENT_PROVIDER: manual
      SENTRY_REQUIRED: "false"
      SENTRY_ENVIRONMENT: test
      SENTRY_TRACES_SAMPLE_RATE: "0"
      ALLOW_ADMIN_BOOTSTRAP: "true"
      BOOTSTRAP_ADMIN_NAME: CI Admin
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.test
      SMOKE_BASE_URL: http://127.0.0.1:3000
      SMOKE_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare CI secret env
        shell: bash
        run: |
          write_env() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
          }

          repeat_env() {
            local value
            value="$(printf "%${2}s" "" | tr " " "$3")"
            write_env "$1" "$value"
          }

          repeat_env JWT_SECRET 64 j
          repeat_env MFA_ENCRYPTION_KEY 32 m
          repeat_env FINANCIAL_ENCRYPTION_KEY 32 f
          write_env RESEND_API_KEY test-key
          write_env CLOUDINARY_API_KEY test-key
          write_env CLOUDINARY_API_SECRET test-secret
          write_env BOOTSTRAP_ADMIN_PASSWORD StrongPassword!123456
          write_env SMOKE_PASSWORD StrongPassword!123456
      - name: Apply migrations
        run: npm run db:migrate
      - name: Run backend tests
        run: npm test
        env:
          DATABASE_URL: ""
          VERIFY_DATABASE_URL: ""
          UPLOAD_PROVIDER: local
          EMAIL_PROVIDER: log
          SENTRY_REQUIRED: "false"
      - name: Bootstrap first admin
        run: npm run bootstrap:admin
      - name: Verify row level security
        run: npm run verify:rls
      - name: Start API
        env:
          MFA_REQUIRED_ROLES: ""
        run: |
          npm run start > backend.log 2>&1 &
          echo $! > backend.pid
      - name: Wait for readiness check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat backend.log
          exit 1
      - name: Smoke test
        run: npm run smoke
      - name: Stop API
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
          if [ -f backend.log ]; then
            cat backend.log
          fi
