<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/svg/one-favicon.svg"/>
  <title>Redefinir senha - ONE Comunicação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --pink:#E83469;
      --pink-dark:#c42558;
      --ink:#17171b;
      --muted:#67645f;
      --line:#e6e2dc;
      --font-d:'Fraunces',serif;
      --font-b:'Inter',sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:linear-gradient(180deg,#faf7f2 0%,#f2ede6 100%);
      color:var(--ink);
      font-family:var(--font-b);
    }
    .card{
      width:min(100%,460px);
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 18px 44px rgba(28,21,15,.08);
      padding:36px 34px;
    }
    .eyebrow{
      margin:0 0 14px;
      color:var(--pink);
      font-size:11px;
      font-weight:600;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 10px;
      font-family:var(--font-d);
      font-size:32px;
      line-height:1.05;
    }
    p{
      margin:0;
      color:var(--muted);
      line-height:1.7;
      font-size:15px;
    }
    label{
      display:block;
      margin:22px 0 8px;
      font-size:11px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
    }
    input,button{
      width:100%;
      padding:13px 14px;
      font-size:15px;
      font-family:var(--font-b);
    }
    input{
      border:1px solid var(--line);
      background:#f4f1ec;
      outline:none;
    }
    input:focus{
      border-color:var(--pink);
      background:#fff;
    }
    button{
      margin-top:18px;
      background:var(--pink);
      color:#fff;
      border:none;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    button:hover{background:var(--pink-dark)}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{
      margin-top:16px;
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
    }
    .msg.success{color:#1a7a40}
    .msg.error{color:var(--pink-dark)}
    @media (max-width:560px){
      body{padding:16px}
      .card{padding:28px 22px}
      h1{font-size:26px}
      p{font-size:14px;line-height:1.6}
    }
    @media (max-width:375px){
      body{padding:12px}
      .card{padding:24px 18px}
      h1{font-size:24px}
      label{margin:18px 0 6px}
      input,button{font-size:14px;padding:12px 13px;min-height:44px}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Recuperação de acesso</div>
    <h1>Redefinir senha</h1>
    <p>Defina uma nova senha para retomar o acesso. Use no mínimo 12 caracteres, com letras maiúsculas, minúsculas, números e símbolos.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input id="password" type="password" required />
      <button type="submit" id="reset-btn">Atualizar senha</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const form = document.getElementById("reset-form");
    const msg = document.getElementById("msg");
    const button = document.getElementById("reset-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "";
      msg.className = "msg";
      button.disabled = true;
      button.textContent = "Atualizando...";

      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || "Não foi possível redefinir a senha.");
        }

        msg.textContent = "Senha redefinida com sucesso. Você já pode voltar ao login.";
        msg.classList.add("success");
      } catch (error) {
        msg.textContent = error.message;
        msg.classList.add("error");
      } finally {
        button.disabled = false;
        button.textContent = "Atualizar senha";
      }
    });
  </script>
</body>
</html>
