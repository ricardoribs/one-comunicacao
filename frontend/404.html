<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/svg/one-favicon.svg"/>
  <title>404 - ONE Comunicação Integrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --pink:#E83469;
      --pink-dark:#c42558;
      --ink:#17171b;
      --muted:#67645f;
      --paper:#f7f4ef;
      --line:rgba(23,23,27,.1);
      --font-d:'Fraunces',serif;
      --font-b:'Inter',sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:linear-gradient(180deg,#faf7f2 0%,#f2ede6 100%);
      color:var(--ink);
      font-family:var(--font-b);
    }
    .card{
      width:min(100%,640px);
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      box-shadow:0 18px 44px rgba(28,21,15,.08);
      padding:48px 40px;
      text-align:center;
    }
    .eyebrow{
      margin:0 0 18px;
      color:var(--pink);
      font-size:11px;
      font-weight:600;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 14px;
      font-family:var(--font-d);
      font-size:56px;
      line-height:.95;
    }
    h2{
      margin:0 0 14px;
      font-family:var(--font-d);
      font-size:28px;
      line-height:1.1;
    }
    p{
      margin:0 auto;
      max-width:460px;
      color:var(--muted);
      font-size:16px;
      line-height:1.75;
    }
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:26px;
      padding:14px 22px;
      background:var(--pink);
      color:#fff;
      text-decoration:none;
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    a:hover{background:var(--pink-dark)}
    @media (max-width:560px){
      body{padding:16px}
      .card{padding:34px 22px}
      h1{font-size:44px}
      h2{font-size:24px}
      p{font-size:15px;line-height:1.65}
    }
    @media (max-width:375px){
      body{padding:12px}
      .card{padding:28px 18px}
      h1{font-size:38px}
      h2{font-size:22px}
      a{width:100%;min-height:44px;padding:12px 18px}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Navegação pública</div>
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>O endereço acessado não está disponível ou foi atualizado. Volte para a página principal e continue a navegação a partir dos canais oficiais da ONE.</p>
    <a href="/">Voltar para a página inicial</a>
  </div>
</body>
</html>
